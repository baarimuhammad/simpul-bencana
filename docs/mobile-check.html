<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Pemeriksaan Responsif Internal</title>
    <style>
      body {
        margin: 0;
        background: #dce4e9;
        font-family: system-ui;
      }
      header {
        padding: 14px 25px;
        background: white;
        color: #234;
      }
      iframe {
        width: 390px;
        height: 1000px;
        border: 1px solid #bbc;
        margin: 20px 30px;
        display: block;
        background: white;
      }
      button {
        padding: 8px 15px;
        margin: 0 7px;
        border: 1px solid #abc;
        border-radius: 5px;
        background: white;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header>
      Pemeriksaan internal · bukan halaman aplikasi<button
        onclick="document.querySelector('iframe').style.width = '390px'"
      >
        390 px</button
      ><button onclick="document.querySelector('iframe').style.width = '360px'">
        360 px</button
      ><button onclick="document.querySelector('iframe').style.width = '768px'">
        768 px
      </button>
    </header>
    <iframe title="Pratinjau ponsel" src="/"></iframe>
  </body>
</html>
